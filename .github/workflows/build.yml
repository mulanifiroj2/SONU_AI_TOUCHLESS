
name: Build SONU AI Touchless APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o SONU_AI_TOUCHLESS_FINAL.zip -d extracted
          cp -r extracted/. .

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download hand tracking model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
          -o app/src/main/assets/hand_landmarker.task

      - name: Build SONU AI APK
        run: gradle assembleDebug

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SONU-AI-TOUCHLESS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
